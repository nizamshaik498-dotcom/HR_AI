services:
  - type: web
    name: hr-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
    healthCheckPath: /api/health
    autoDeploy: true